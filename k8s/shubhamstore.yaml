apiVersion: v1
kind: Namespace
metadata:
  name: shubhamstore
  labels:
    app.kubernetes.io/name: shubhamstore
    environment: production

---
# ---------------------------------------------------------
# CONFIGURATION & SECRETS
# ---------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: shubhamstore-config
  namespace: shubhamstore
  labels:
    app.kubernetes.io/name: shubhamstore
    app.kubernetes.io/component: frontend
data:
  REDIS_HOST: "shubhamstore-redis"
  REDIS_PORT: "6379"

---
apiVersion: v1
kind: Secret
metadata:
  name: shubhamstore-secrets
  namespace: shubhamstore
  labels:
    app.kubernetes.io/name: shubhamstore
    app.kubernetes.io/component: frontend
type: Opaque
data:
  # Base64 encoded 'dummy-password' - Lays the groundwork for Redis Auth
  # without hardcoding credentials in the deployment manifest.
  REDIS_PASSWORD: "ZHVtbXktcGFzc3dvcmQ=" 

---
# ---------------------------------------------------------
# CACHE LAYER (REDIS)
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shubhamstore-redis
  namespace: shubhamstore
  labels:
    app.kubernetes.io/name: shubhamstore
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shubhamstore
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shubhamstore
        app.kubernetes.io/component: cache
    spec:
      containers:
      - name: redis
        image: redis:alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          dropCapabilities:
            - ALL
          # Redis can safely run as a non-root user
          runAsNonRoot: true
          runAsUser: 999

---
apiVersion: v1
kind: Service
metadata:
  name: shubhamstore-redis
  namespace: shubhamstore
  labels:
    app.kubernetes.io/name: shubhamstore
    app.kubernetes.io/component: cache
spec:
  # Ensures Redis is NOT exposed publicly outside the cluster
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shubhamstore
    app.kubernetes.io/component: cache
  ports:
  - name: redis
    port: 6379
    targetPort: 6379

---
# ---------------------------------------------------------
# APPLICATION LAYER (PHP FRONTEND)
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shubhamstore-app
  namespace: shubhamstore
  labels:
    app.kubernetes.io/name: shubhamstore
    app.kubernetes.io/component: frontend
  annotations:
    description: "ShubhamStore Frontend Deployment - Highly Available"
    owner: "Shubham Gavhane"
spec:
  # 1. Run multiple replicas for High Availability
  replicas: 3
  
  # 12. Configure Rolling Updates for zero-downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # Spin up 1 new pod before killing an old one
      maxUnavailable: 0    # Ensure we never dip below 3 desired replicas during updates
      
  selector:
    matchLabels:
      app.kubernetes.io/name: shubhamstore
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shubhamstore
        app.kubernetes.io/component: frontend
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        # Block app startup until the Redis ClusterIP service is resolving and reachable
        command: ['sh', '-c', 'until nc -z shubhamstore-redis 6379; do echo "Waiting for Redis..."; sleep 2; done;']
        
      containers:
      - name: php-apache
        image: shubhamstore:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        
        # 5, 8. Inject non-sensitive configuration via ConfigMap
        envFrom:
        - configMapRef:
            name: shubhamstore-config
            
        # 6, 7. Inject sensitive credentials securely via Secret
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shubhamstore-secrets
              key: REDIS_PASSWORD
              
        # 10. Liveness Probe (App only)
        livenessProbe:
          httpGet:
            path: /health-live.php
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          
        # 9. Readiness Probe (App + Redis + Data Dependencies)
        readinessProbe:
          httpGet:
            path: /health-ready.php
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
          
        # 11. Resource Requests and Limits prevents node starvation
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
            
        # 13, 14. Security Context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: 
              - ALL
          # Note on Requirement #13 (Non-Root where practical): 
          # We cannot use `runAsNonRoot: true` here because the base php:8.2-apache image 
          # strictly requires root to bind to port 80 and manage Apache logs. 
          # We've secured it "where practical" by dropping all elevated Linux capabilities.

---
apiVersion: v1
kind: Service
metadata:
  name: shubhamstore-app
  namespace: shubhamstore
  labels:
    app.kubernetes.io/name: shubhamstore
    app.kubernetes.io/component: frontend
spec:
  # 3. Use a ClusterIP Service (Internal only). 
  # In a production environment, an Ingress controller would route external traffic to this ClusterIP.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shubhamstore
    app.kubernetes.io/component: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
