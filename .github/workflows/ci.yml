name: ShubhamStore CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 4. Required permissions for AWS OIDC authentication (Least Privilege)
permissions:
  id-token: write # Required for requesting the JWT token from GitHub
  contents: read  # Required for actions/checkout

env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "shubhamstore-app"
  EKS_CLUSTER: "shubhamstore-eks"
  # This secret holds the ARN of the IAM Role created in AWS that trusts GitHub's OIDC provider.
  AWS_OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}

jobs:
  # ---------------------------------------------------------
  # CONTINUOUS INTEGRATION (Tests & Scanning)
  # ---------------------------------------------------------
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Validate PHP Syntax
        run: find app/ -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build the Docker Image (Local test)
      - name: Build Docker Image (Local)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: shubhamstore:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Scan the Image with Trivy
      - name: Scan the Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'shubhamstore:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Validate Kubernetes Manifests
        uses: yannh/kubeconform-action@v2
        with:
          kubernetes-version: '1.28.0'
          target: 'k8s/'
          strict: true

      - name: Validate Helm Templates
        run: |
          for dir in helm/*/; do
            if [ -f "$dir/Chart.yaml" ]; then
              helm lint "$dir" --strict
              helm template "$dir" > /dev/null
            fi
          done

  # ---------------------------------------------------------
  # CONTINUOUS DEPLOYMENT (AWS EKS)
  # ---------------------------------------------------------
  cd:
    name: Continuous Deployment (EKS)
    needs: ci
    # Only run CD when code is successfully pushed/merged to the main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 4 & 8. Authenticate securely using GitHub Actions OIDC (No long-lived keys!)
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Build, tag, and push image to Amazon ECR
      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Pull EKS credentials into the runner's kubeconfig
      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # 5, 6, 7. Deploy using Helm, wait for rollout, and fail/rollback on error
      - name: Deploy to Amazon EKS via Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # --wait blocks the pipeline until all pods are fully Ready.
          # --atomic automatically triggers a rollback to the previous successful release if the deployment fails.
          helm upgrade --install shubhamstore-release ./helm/shubhamstore \
            --set image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG \
            --wait \
            --atomic \
            --timeout 5m
