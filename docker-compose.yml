services:
  redis:
    image: redis:alpine
    container_name: shubhamstore_redis
    # Enable AOF (Append Only File) for persistence rather than ephemeral memory
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - shubhamstore_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  app:
    build: .
    container_name: shubhamstore_app
    ports:
      - "8080:80"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - shubhamstore_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -f http://localhost/health-ready.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  shubhamstore_net:
    driver: bridge

volumes:
  redis_data:
    name: shubhamstore_redis_data
