apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shubhamstore.fullname" . }}-redis-netpol
  labels:
    {{- include "shubhamstore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shubhamstore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "shubhamstore.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "shubhamstore.fullname" . }}-app-netpol
  labels:
    {{- include "shubhamstore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shubhamstore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "shubhamstore.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: cache
      ports:
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
