apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shubhamstore.fullname" . }}-redis
  labels:
    {{- include "shubhamstore.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "shubhamstore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        {{- include "shubhamstore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache
    spec:
      containers:
      - name: redis
        image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          dropCapabilities:
            - ALL
          runAsNonRoot: true
          runAsUser: 999
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shubhamstore.fullname" . }}-redis
  labels:
    {{- include "shubhamstore.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  selector:
    {{- include "shubhamstore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
