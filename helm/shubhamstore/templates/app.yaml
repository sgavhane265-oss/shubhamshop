apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shubhamstore.fullname" . }}-app
  labels:
    {{- include "shubhamstore.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "shubhamstore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "shubhamstore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ include "shubhamstore.fullname" . }}-redis 6379; do echo "Waiting for Redis..."; sleep 2; done;']
      containers:
      - name: php-apache
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: {{ include "shubhamstore.fullname" . }}-config
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "shubhamstore.fullname" . }}-secrets
              key: REDIS_PASSWORD
        livenessProbe:
          httpGet:
            path: /health-live.php
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health-ready.php
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shubhamstore.fullname" . }}-app
  labels:
    {{- include "shubhamstore.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "shubhamstore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: 80
